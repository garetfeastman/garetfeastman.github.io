<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUX Together</title>
<meta name="description" content="Listen along with what's playing on AUX, in sync.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: one room — the record on the left, the song and controls on the right; stacks on phones. */
:root {
  --night: #0b0b10;
  --panel: #15151d;
  --line: #2a2a36;
  --ink: #f4f2f7;
  --muted: #a3a1ad;
  --aux: #ff3b6b;
  --glow: #7a5cff;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(24px, env(safe-area-inset-top, 0px)) 40px;
}
#backdrop {
  position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background-size: cover; background-position: center;
  filter: blur(60px) saturate(1.3) brightness(.35);
  opacity: 0; transition: opacity 1.2s ease;
}
#backdrop.on { opacity: 1; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.brand b { color: var(--aux); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.live[data-state="live"] .dot { background: var(--aux); box-shadow: 0 0 0 0 var(--aux); animation: pulse 1.8s infinite; }
.live[data-state="live"] { color: var(--ink); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,107,.6); } 100% { box-shadow: 0 0 0 12px rgba(255,59,107,0); } }

.room { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 48px; align-items: center; }
@media (max-width: 760px) { .room { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.record-col { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.record { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; margin: 0 auto; }
.record .disc {
  position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, #111 0 2px, #1a1a22 2px 4px);
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px var(--line);
}
.record img[hidden] { display: none; }
.record img {
  position: absolute; inset: 18%; width: 64%; height: 64%; border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 6px #0b0b10;
}
.record .spindle { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--night); box-shadow: inset 0 0 0 2px var(--line); }
.spin { animation: spin 7s linear infinite; }
.paused .spin { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .live[data-state="live"] .dot { animation: none; } }

.info { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--aux); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.artist { font-size: clamp(18px, 2.4vw, 24px); color: var(--ink); font-weight: 600; margin: 0; }
.album { color: var(--muted); margin: 0; }
.time { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--glow), var(--aux)); border-radius: 3px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
button {
  font: 700 16px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 14px 26px; cursor: pointer;
}
button.primary { background: var(--aux); border-color: var(--aux); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
button[hidden] { display: none !important; }
.vol { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.vol input { width: 140px; accent-color: var(--aux); }
.status { color: var(--muted); font-size: 15px; min-height: 1.5em; }
.status a { color: var(--ink); }
.player { display: flex; flex-direction: column; gap: 8px; }
.player .frame { width: 320px; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
.player .frame > * { width: 100%; height: 100%; }
.player small { color: var(--muted); }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: 13px; }
.spinner { position: absolute; inset: 0; }
.label {
  position: absolute; inset: 18%; border-radius: 50%; overflow: hidden; background: #000;
  box-shadow: 0 0 0 6px #0b0b10; opacity: 0; pointer-events: none; transition: opacity .4s ease, border-radius .3s ease;
}
.joined .label { opacity: 1; pointer-events: auto; }
/* The video is 16:9; widen it so the artwork fills the round label. */
.label > *, .label iframe { position: absolute; top: 0; left: -38.9%; width: 177.8% !important; height: 100% !important; display: block; border: 0; }
.spindle { z-index: 2; }
/* "Show the player": stop spinning and show the whole player (to press Skip on an ad). */
.peek .spinner { animation: none; }
.peek .label { border-radius: 14px; inset: 12%; }
.peek .label > *, .peek .label iframe { left: 0; width: 100% !important; }
.peek .spindle { display: none; }
.peek-btn { align-self: center; }
.chat { display: flex; flex-direction: column; gap: 10px; background: rgba(21,21,29,.72); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.chat-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button.link { background: none; border: 0; padding: 0; color: var(--muted); font: 600 13px var(--body); text-transform: none; letter-spacing: 0; text-decoration: underline; cursor: pointer; }
.msgs { height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; overscroll-behavior: contain; }
.msg { line-height: 1.35; overflow-wrap: anywhere; }
.msg b { color: var(--aux); font-weight: 700; margin-right: 6px; }
.msg.me b { color: var(--glow); }
.msg time { color: var(--muted); font-size: 12px; margin-left: 6px; }
.chat-form { display: flex; gap: 8px; flex-wrap: wrap; }
.chat-form input { flex: 1 1 140px; min-width: 0; font: 16px var(--body); color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; }
.chat-form #chatName { flex: 0 1 140px; }
.chat-form button { padding: 11px 20px; }
.tour[hidden] { display: none; }
.tour { display: flex; flex-direction: column; gap: 8px; }
.tour-head { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: 14px; }
.tour-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.show { flex: 0 0 auto; display: flex; gap: 12px; align-items: center; min-width: 210px; max-width: 260px; padding: 10px 14px; border-radius: 14px;
  background: rgba(21,21,29,.72); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.show:hover, .show:focus-visible { border-color: var(--aux); }
.show .d { display: flex; flex-direction: column; align-items: center; min-width: 44px; line-height: 1.1; }
.show .d b { color: var(--aux); font-size: 12px; letter-spacing: .1em; }
.show .d strong { font-size: 24px; }
.show .w { min-width: 0; }
.show .w div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show .w .c { font-weight: 700; }
.show .w .v { color: var(--muted); font-size: 13px; }
.tour .none { color: var(--muted); font-size: 14px; }
</style>
</head>
<body class="paused">
<div id="backdrop"></div>
<div class="wrap">
  <header>
    <div class="brand"><b>AUX</b> Together</div>
    <div class="live" id="live" data-state="waiting"><span class="dot"></span><span id="liveText">Connecting…</span></div>
  </header>

  <main class="room">
    <div class="record-col">
    <div class="record" id="record">
      <div class="spinner spin">
        <div class="disc"></div>
        <img id="art" alt="" hidden>
        <!-- While listening, YouTube's player is the record's label: round, cropped to the artwork, spinning with the record. -->
        <div class="label" id="label"><div id="yt"></div></div>
        <div class="spindle"></div>
      </div>
    </div>
    <button type="button" class="link peek-btn" id="peek" hidden>Ad playing? Show the player</button>
    </div>
    <section class="info" aria-live="polite">
      <div class="eyebrow" id="eyebrow">Waiting for the TV</div>
      <h1 id="title">Nothing playing yet</h1>
      <p class="artist" id="artist"></p>
      <p class="album" id="album"></p>
      <div class="time"><span id="cur">0:00</span><div class="bar"><i id="fill"></i></div><span id="dur">0:00</span></div>
      <div class="controls">
        <button class="primary" id="join" type="button">Join and listen</button>
        <button id="leave" type="button" hidden>Stop listening</button>
        <label class="vol" for="volume">Volume <input id="volume" type="range" min="0" max="100" value="80"></label>
      </div>
      <div class="status" id="status">Press Join to hear it here, in sync with the TV.</div>
      <div class="tour" id="tour" hidden>
        <div class="tour-head"><span class="eyebrow">On tour</span><span id="tourArtist"></span></div>
        <div class="tour-list" id="tourList"></div>
      </div>
      <div class="chat" id="chat">
        <div class="chat-head"><span>Chat</span><button type="button" class="link" id="rename" hidden></button></div>
        <div class="msgs" id="msgs" aria-live="polite"><div class="empty" id="noMsgs">No messages yet. Say hi.</div></div>
        <form class="chat-form" id="chatForm" autocomplete="off">
          <input id="chatName" placeholder="Your name" maxlength="24" aria-label="Your name">
          <input id="chatText" placeholder="Message" maxlength="300" aria-label="Message">
          <button type="submit" class="primary">Send</button>
        </form>
      </div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>

<script>
(() => {
  window.addEventListener('hashchange', () => location.reload());
  const code = (location.hash || '').replace(/^#/, '').replace(/[^\w-]/g, '');
  const topic = !code ? '' : code.startsWith('aux-') ? code : 'aux-' + code;
  const $ = id => document.getElementById(id);
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let state = null, recvAt = 0, lag = 0, player = null, ready = false, joined = false, loadedId = '', blocked = '';

  if (!topic) {
    $('title').textContent = 'This link is missing its code';
    $('eyebrow').textContent = 'Ask for the link again';
    $('status').textContent = 'Open the full link your friend sent (it ends with # and a short code).';
    $('join').hidden = true;
    return;
  }
  $('foot').textContent = 'Room ' + topic;

  function expected() {
    if (!state) return 0;
    let p = state.pos || 0;
    if (state.playing) p += lag + (Date.now() - recvAt) / 1000;
    return state.dur ? Math.min(p, state.dur) : p;
  }

  function render() {
    const live = $('live');
    if (!state || state.off) {
      live.dataset.state = 'waiting';
      $('liveText').textContent = state && state.off ? 'Sharing stopped' : 'Waiting';
      $('eyebrow').textContent = state && state.off ? 'The TV stopped sharing' : 'Waiting for the TV';
      document.body.classList.add('paused');
      return;
    }
    live.dataset.state = state.playing ? 'live' : 'waiting';
    $('liveText').textContent = state.playing ? 'Live' : 'Paused on the TV';
    $('eyebrow').textContent = state.playing ? 'Now playing on the TV' : 'Paused on the TV';
    $('title').textContent = state.t || 'Unknown song';
    $('artist').textContent = state.a || '';
    $('album').textContent = state.al || '';
    document.title = (state.t ? state.t + ' · ' : '') + 'AUX Together';
    if (state.art && $('art').dataset.src !== state.art) {
      $('art').dataset.src = state.art; $('art').src = state.art; $('art').hidden = false;
      $('backdrop').style.backgroundImage = 'url("' + state.art.replace(/"/g, '%22') + '")';
      $('backdrop').classList.add('on');
    }
    document.body.classList.toggle('paused', !state.playing);
  }

  function tick() {
    if (state && !state.off) {
      const e = expected();
      $('cur').textContent = fmt(e); $('dur').textContent = fmt(state.dur);
      $('fill').style.width = state.dur ? Math.min(100, e / state.dur * 100) + '%' : '0';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Keep this device's player matching the TV.
  function sync(force) {
    if (!joined || !ready || !state) return;
    if (state.off) { player.pauseVideo(); return; }
    const want = expected();
    if (state.id !== loadedId) {
      loadedId = state.id; blocked = '';
      if (state.playing) player.loadVideoById({videoId: state.id, startSeconds: want});
      else player.cueVideoById({videoId: state.id, startSeconds: want});
      $('status').textContent = 'Listening along.';
      return;
    }
    if (blocked) return;
    const ps = player.getPlayerState();
    if (state.playing) {
      // Song finished here a moment before the TV moved on: wait for the TV's next song
      // (don't restart this one from the beginning).
      if (ps === YT.PlayerState.ENDED || (state.dur && want >= state.dur - 1.5)) return;
      if (ps !== YT.PlayerState.PLAYING && ps !== YT.PlayerState.BUFFERING) player.playVideo();
      const cur = player.getCurrentTime() || 0;
      if (force ? Math.abs(cur - want) > 1.5 : Math.abs(cur - want) > 5) player.seekTo(want, true);
    } else {
      if (ps === YT.PlayerState.PLAYING) player.pauseVideo();
      if (Math.abs((player.getCurrentTime() || 0) - want) > (force ? 1.5 : 5)) player.seekTo(want, true);
    }
  }
  setInterval(() => sync(false), 2000);

  function receive(raw) {
    let s; try { s = JSON.parse(raw); } catch (_) { return; }
    if (!s || s.v !== 1) return;
    if (state && s.ts && state.ts && s.ts < state.ts) return; // older than what we have
    const age = Date.now() - (s.ts || Date.now());
    if (age > 6 * 3600 * 1000) return; // stale from hours ago
    // Only jump when something really changed (new song, play/pause, or the TV skipped within the song).
    // The TV's regular check-ins shouldn't move playback here.
    const before = state ? expected() : 0;
    const changed = !state || state.off || s.off || s.id !== state.id || !!s.playing !== !!state.playing;
    state = s; recvAt = Date.now();
    // Network delay estimate. Device clocks can differ, so keep it small and sane.
    lag = age > 0 && age < 8000 ? Math.min(1.5, age / 1000) : 0.3;
    const jumped = !changed && Math.abs(expected() - before) > 4;
    render(); sync(changed || jumped); drawTour();
  }

  // ---- Chat: everyone on this link. Messages go over the same live channel; the latest ~40 are kept for people who join later.
  let mq = null;
  const chatTopic = 'auxchat/' + topic.replace(/^aux-/, '');
  const chat = new Map();
  const me = Math.random().toString(36).slice(2, 10);
  let myName = ''; try { myName = localStorage.getItem('auxName') || ''; } catch (_) {}
  function showName() {
    $('chatName').style.display = myName ? 'none' : '';
    $('rename').hidden = !myName;
    $('rename').textContent = myName ? 'You are ' + myName + ' · change' : '';
  }
  showName();
  $('rename').addEventListener('click', () => { myName = ''; showName(); $('chatName').focus(); });
  function chatIn(raw, live) {
    let m = raw; if (typeof raw === 'string') { try { m = JSON.parse(raw); } catch (_) { return; } }
    if (!m || m.v !== 1 || !m.id || chat.has(m.id) || typeof m.m !== 'string') return;
    m.n = String(m.n || 'Someone').slice(0, 24); m.m = m.m.slice(0, 300); m.ts = Number(m.ts) || Date.now();
    chat.set(m.id, m);
    drawChat();
  }
  function drawChat() {
    const box = $('msgs');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    const list = [...chat.values()].sort((a, b) => a.ts - b.ts).slice(-100);
    box.replaceChildren();
    if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No messages yet. Say hi.'; box.append(e); return; }
    for (const m of list) {
      const row = document.createElement('div'); row.className = 'msg' + (m.from === me ? ' me' : '');
      const who = document.createElement('b'); who.textContent = m.n;
      const text = document.createElement('span'); text.textContent = m.m;
      const t = document.createElement('time'); t.textContent = new Date(m.ts).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
      row.append(who, text, t); box.append(row);
    }
    if (nearBottom) box.scrollTop = box.scrollHeight;
  }
  let lastSent = 0;
  $('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    if (!myName) {
      const n = $('chatName').value.trim().slice(0, 24);
      if (!n) { $('chatName').focus(); return; }
      myName = n; try { localStorage.setItem('auxName', n); } catch (_) {}
      showName();
    }
    const text = $('chatText').value.trim().slice(0, 300);
    if (!text || !mq || !mq.connected || Date.now() - lastSent < 700) return;
    lastSent = Date.now();
    const m = {v: 1, id: me + '-' + Date.now().toString(36), from: me, n: myName, m: text, ts: Date.now()};
    $('chatText').value = '';
    chatIn(m, true);
    mq.publish(chatTopic, JSON.stringify(m));
    const recent = [...chat.values()].sort((a, b) => a.ts - b.ts).slice(-40);
    mq.publish(chatTopic + '/h', JSON.stringify(recent), {retain: true});
    $('msgs').scrollTop = $('msgs').scrollHeight;
  });

  // ---- Upcoming shows for the artist that's playing (the TV looks them up and sends them).
  let tour = null;
  const normName = x => String(x || '').toLowerCase().replace(/&/g, 'and').replace(/^the\s+/, '').replace(/[^a-z0-9]/g, '');
  function tourIn(raw) {
    try { tour = JSON.parse(raw); } catch (_) { return; }
    drawTour();
  }
  function drawTour() {
    const box = $('tour');
    const playing = state && !state.off ? normName(state.a) : '';
    if (!tour || !Array.isArray(tour.shows) || !playing || !playing.startsWith(normName(tour.artist))) { box.hidden = true; return; }
    $('tourArtist').textContent = tour.artist;
    const list = $('tourList'); list.replaceChildren();
    if (!tour.shows.length) {
      const none = document.createElement('div'); none.className = 'none'; none.textContent = 'No upcoming tour dates right now.';
      list.append(none); box.hidden = false; return;
    }
    for (const sh of tour.shows) {
      const a = document.createElement('a'); a.className = 'show';
      if (/^https:\/\//.test(sh.u || '')) { a.href = sh.u; a.target = '_blank'; a.rel = 'noopener'; }
      const dt = new Date(String(sh.d) + 'T12:00:00');
      const d = document.createElement('div'); d.className = 'd';
      const mo = document.createElement('b'); mo.textContent = isNaN(dt) ? '' : dt.toLocaleDateString('en-US', {month: 'short'}).toUpperCase();
      const dy = document.createElement('strong'); dy.textContent = isNaN(dt) ? String(sh.d || '') : String(dt.getDate());
      d.append(mo, dy);
      const w = document.createElement('div'); w.className = 'w';
      const c = document.createElement('div'); c.className = 'c'; c.textContent = sh.c || '';
      const v = document.createElement('div'); v.className = 'v'; v.textContent = (sh.v || '') + (sh.s === 'offsale' ? ' · off sale' : '');
      w.append(c, v);
      a.append(d, w); list.append(a);
    }
    box.hidden = false;
  }

  // Live updates from the TV. Main: an MQTT channel that keeps the latest state for late joiners.
  // Backup: ntfy.sh (song changes and play/pause only).
  function connect() {
    const room = topic.replace(/^aux-/, '');
    const lib = document.createElement('script');
    lib.src = 'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';
    lib.onload = () => {
      try {
        const c = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {clientId: 'auxweb-' + Math.random().toString(16).slice(2), clean: true, reconnectPeriod: 3000, connectTimeout: 8000});
        mq = c;
        c.on('connect', () => { c.subscribe(['auxtogether/' + room, chatTopic, chatTopic + '/h', 'auxtour/' + room]); if (!state) $('liveText').textContent = 'Waiting'; });
        c.on('message', (t, p) => {
          if (t === chatTopic) chatIn(p.toString(), true);
          else if (t === 'auxtour/' + room) tourIn(p.toString());
          else if (t === chatTopic + '/h') { try { (JSON.parse(p.toString()) || []).forEach(m => chatIn(m, false)); } catch (_) {} }
          else receive(p.toString());
        });
      } catch (_) {}
    };
    document.head.appendChild(lib);
    const es = new EventSource('https://ntfy.sh/' + topic + '/sse?since=2h');
    es.onopen = () => { if (!state) $('liveText').textContent = 'Waiting'; };
    es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message' && m.message) receive(m.message); } catch (_) {} };
    es.onerror = () => { $('liveText').textContent = 'Reconnecting…'; };
  }
  connect();

  // YouTube's own player plays the song on this device.
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      width: '100%', height: '100%',
      playerVars: {autoplay: 0, controls: 0, playsinline: 1, rel: 0, modestbranding: 1},
      events: {
        onReady: () => { ready = true; player.setVolume(Number($('volume').value)); if (joined) sync(true); },
        onError: e => {
          if ([100, 101, 150].includes(e.data) && state) {
            blocked = state.id;
            const t = Math.floor(expected());
            $('status').innerHTML = 'This song can only play on YouTube Music. <a target="_blank" rel="noopener" href="https://music.youtube.com/watch?v=' + encodeURIComponent(state.id) + '&t=' + t + 's">Open it there</a>.';
          }
        }
      }
    });
  };
  const yt = document.createElement('script');
  yt.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(yt);

  $('join').addEventListener('click', () => {
    joined = true; document.body.classList.add('joined'); $('peek').hidden = false;
    $('join').hidden = true; $('leave').hidden = false;
    $('status').textContent = state && !state.off ? 'Listening along.' : 'Joined. Music starts when the TV plays something.';
    if (ready) { player.unMute(); player.setVolume(Number($('volume').value)); }
    loadedId = ''; sync(true);
  });
  $('peek').addEventListener('click', () => {
    const on = document.body.classList.toggle('peek');
    $('peek').textContent = on ? 'Back to the record' : 'Ad playing? Show the player';
  });
  $('leave').addEventListener('click', () => {
    joined = false; loadedId = ''; document.body.classList.remove('joined', 'peek'); $('peek').hidden = true; $('peek').textContent = 'Ad playing? Show the player';
    if (ready) player.stopVideo();
    $('join').hidden = false; $('leave').hidden = true;
    $('status').textContent = 'Stopped. Press Join to listen again.';
  });
  const setVol = () => { if (!ready) return; const v = Number($('volume').value); if (v > 0) player.unMute(); player.setVolume(v); };
  $('volume').addEventListener('input', setVol);
  $('volume').addEventListener('change', setVol);
  // Phones only let their own volume buttons change the sound: hide the slider there.
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform))) {
    const vl = document.querySelector('label.vol'); if (vl) vl.style.display = 'none';
  }
})();
</script>
</body>
</html>
